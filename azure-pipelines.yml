# CI/CD: Pact contract tests gate (TaxMesh) — EY_Demo-style reporting
# Azure DevOps: https://dev.azure.com/InnoVisionDA/ContractTesting
# GitHub:       https://github.com/Avinash258/ContractTestingDemoProject
#
# Run pipeline UI parameters (recommended):
#   gatewayBaseUrl  — TaxMesh gateway (required for provider)
#   reportEmailTo   — HTML report recipient
#
# Optional pipeline variables (secrets where noted):
#   GATEWAY_BASE_URL / TAXMESH_BASE_URL — fallback if UI param empty
#   URL_CLM … URL_DOC
#   SMTP_USER / SMTP_PASS (secret) — required to actually send email
#   SMTP_FROM / SMTP_HOST / SMTP_PORT

# These fields appear in Azure DevOps → Pipelines → Run pipeline (NOT from the YAML editor Run).
parameters:
  - name: gatewayBaseUrl
    displayName: '1) TaxMesh TARGET URL (paste before run) — e.g. https://xxxx.ngrok-free.app'
    type: string
    default: ''

  - name: reportEmailTo
    displayName: '2) Report email TO (HTML results)'
    type: string
    default: 'aviansh.sharma@newvision-software.com'

  - name: skipProviderIfNoGateway
    displayName: '3) Skip provider if TARGET URL is empty'
    type: boolean
    default: true

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20.x'
  PACT_DO_NOT_TRACK: 'true'
  SMTP_HOST: 'smtp.office365.com'
  SMTP_PORT: '587'
  SMTP_FROM: 'aviansh.sharma@newvision-software.com'
  # Prefer Run-pipeline UI params; definition variables remain fallbacks in scripts
  RUNTIME_GATEWAY_BASE_URL: ${{ parameters.gatewayBaseUrl }}
  RUNTIME_REPORT_EMAIL_TO: ${{ parameters.reportEmailTo }}
  SKIP_PROVIDER_IF_NO_GATEWAY: ${{ parameters.skipProviderIfNoGateway }}

stages:
  - stage: ContractTests
    displayName: 'Pact Contract Tests'
    jobs:
      - job: ConsumerContracts
        displayName: 'Consumer — generate pact files + report seed'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run test:contract:consumer-only
            displayName: 'Run consumer contract tests + HTML/JSON report'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish pact files'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/pacts
              artifact: pact-files

          - task: PublishPipelineArtifact@1
            displayName: 'Publish consumer reports'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/reports
              artifact: pact-reports

      - job: ProviderVerification
        displayName: 'Provider — verify TaxMesh APIs + email report'
        dependsOn: ConsumerContracts
        condition: succeeded()
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download pact files'
            inputs:
              buildType: current
              artifactName: pact-files
              targetPath: $(Pipeline.Workspace)/pact-files

          - task: DownloadPipelineArtifact@2
            displayName: 'Download consumer reports'
            inputs:
              buildType: current
              artifactName: pact-reports
              targetPath: $(Pipeline.Workspace)/pact-reports

          - script: |
              set -e
              mkdir -p pacts reports
              cp -r "$(Pipeline.Workspace)/pact-files/"* pacts/ || true
              cp -r "$(Pipeline.Workspace)/pact-reports/"* reports/ || true
              ls -la pacts reports || true
            displayName: 'Restore pact files and consumer results'

          - bash: |
              set -euo pipefail
              # ADO leaves the literal "$(VAR)" when a pipeline variable is unset.
              normalize() {
                local v="${1:-}"
                case "$v" in
                  ''|'$(GATEWAY_BASE_URL)'|'$(TAXMESH_BASE_URL)'|'$(RUNTIME_GATEWAY_BASE_URL)') echo "" ;;
                  *) echo "$v" ;;
                esac
              }
              GATEWAY="$(normalize "${RUNTIME_GATEWAY_BASE_URL:-}")"
              if [ -z "$GATEWAY" ]; then
                GATEWAY="$(normalize "${GATEWAY_BASE_URL:-}")"
              fi
              if [ -z "$GATEWAY" ]; then
                GATEWAY="$(normalize "${TAXMESH_BASE_URL:-}")"
              fi

              if [ -z "$GATEWAY" ]; then
                # Default: skip provider on CI pushes (no Run-pipeline UI values).
                # Set skipProviderIfNoGateway=false on Run pipeline to require a URL.
                if [ "${SKIP_PROVIDER_IF_NO_GATEWAY:-true}" = "False" ] || [ "${SKIP_PROVIDER_IF_NO_GATEWAY:-true}" = "false" ]; then
                  echo "##vso[task.logissue type=error]No TaxMesh gateway URL. Fill Run pipeline → 'TaxMesh gateway base URL', or set variable GATEWAY_BASE_URL."
                  exit 1
                fi
                echo "##vso[task.logissue type=warning]No gateway URL — skipping provider verification. Re-run with Run pipeline → TaxMesh gateway base URL to verify against a live stack."
                echo "##vso[task.setvariable variable=PROVIDER_SKIPPED]true"
                exit 0
              fi

              echo "##vso[task.setvariable variable=RESOLVED_GATEWAY_BASE_URL]$GATEWAY"
              echo "Pre-check gateway: $GATEWAY/api/health"
              if ! curl -sf --retry 8 --retry-delay 3 --connect-timeout 10 "$GATEWAY/api/health" | head -c 800; then
                echo
                echo "##vso[task.logissue type=error]Gateway health check failed for $GATEWAY/api/health — is TaxMesh reachable from the internet?"
                exit 1
              fi
              echo
            displayName: 'Pre-check — TaxMesh gateway health'
            env:
              RUNTIME_GATEWAY_BASE_URL: $(RUNTIME_GATEWAY_BASE_URL)
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(TAXMESH_BASE_URL)
              SKIP_PROVIDER_IF_NO_GATEWAY: $(SKIP_PROVIDER_IF_NO_GATEWAY)

          - script: |
              if [ "${PROVIDER_SKIPPED:-}" = "true" ]; then
                echo "Provider verification skipped (no gateway URL)."
                exit 0
              fi
              export GATEWAY_BASE_URL="${RESOLVED_GATEWAY_BASE_URL:-${GATEWAY_BASE_URL:-}}"
              npm run test:contract:provider-only
            displayName: 'Run provider verification + generate report'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)
              RESOLVED_GATEWAY_BASE_URL: $(RESOLVED_GATEWAY_BASE_URL)
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(TAXMESH_BASE_URL)
              URL_CLM: $(URL_CLM)
              URL_MDM: $(URL_MDM)
              URL_ACC: $(URL_ACC)
              URL_TAX: $(URL_TAX)
              URL_ALC: $(URL_ALC)
              URL_DOC: $(URL_DOC)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)
              PROVIDER_SKIPPED: $(PROVIDER_SKIPPED)

          - bash: |
              set -euo pipefail
              normalize_email() {
                local v="${1:-}"
                case "$v" in
                  ''|'$(RUNTIME_REPORT_EMAIL_TO)'|'$(REPORT_EMAIL_TO)') echo "" ;;
                  *) echo "$v" ;;
                esac
              }
              TO="$(normalize_email "${RUNTIME_REPORT_EMAIL_TO:-}")"
              if [ -z "$TO" ]; then
                TO="$(normalize_email "${REPORT_EMAIL_TO:-}")"
              fi
              if [ -z "$TO" ]; then
                echo "No report email recipient — skipping send."
                exit 0
              fi
              if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
                echo "SMTP_USER or SMTP_PASS not set — skipping email report (recipient would be: $TO)."
                exit 0
              fi
              export REPORT_EMAIL_TO="$TO"
              echo "Sending HTML report to: $REPORT_EMAIL_TO"
              npm run send-report
            displayName: 'Email HTML report'
            condition: succeededOrFailed()
            continueOnError: true
            env:
              RUNTIME_REPORT_EMAIL_TO: $(RUNTIME_REPORT_EMAIL_TO)
              REPORT_EMAIL_TO: $(REPORT_EMAIL_TO)
              SMTP_USER: $(SMTP_USER)
              SMTP_PASS: $(SMTP_PASS)
              SMTP_HOST: $(SMTP_HOST)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_FROM: $(SMTP_FROM)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish provider + combined report'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/reports
              artifact: pact-provider-report
