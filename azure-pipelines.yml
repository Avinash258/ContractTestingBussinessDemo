# CI/CD: Pact contract tests gate (TaxMesh)
# Pattern reference: EY_Demo ContractTestDemo-Pact (build 260)
# Swagger (live): https://pubmed-physiology-speaks-bibliographic.trycloudflare.com/api-docs
#   Gateway listContracts → GET {TARGET}/api/contracts
#   Service proxy         → GET {TARGET}/api/proxy/{CLM|MDM|ACC|TAX|ALC|DOC}/…
# Project: https://dev.azure.com/InnoVisionDA/ContractTesting
#
# Run pipeline UI — paste gateway origin only (no /api-docs path). Override when tunnel rotates.
# Required secret variable: SMTP_PASS = Gmail App Password for SMTP_USER below.

parameters:
  - name: gatewayBaseUrl
    displayName: 'TaxMesh gateway origin (from api-docs server URL, no trailing path)'
    type: string
    default: 'https://pubmed-physiology-speaks-bibliographic.trycloudflare.com'

  - name: reportEmailTo
    displayName: 'Send HTML report to'
    type: string
    default: 'avinash.sharma@newvision-software.com,ananthi.balasubramanian@newvision-software.com,satyam.chouksey@newvision-software.com'

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20.x'
  PACT_DO_NOT_TRACK: 'true'
  # EY_Demo-style: put target URL in YAML variables (auto-injected into scripts)
  GATEWAY_BASE_URL: ${{ parameters.gatewayBaseUrl }}
  TAXMESH_BASE_URL: ${{ parameters.gatewayBaseUrl }}
  PACT_PROVIDER_URL: ${{ parameters.gatewayBaseUrl }}
  REPORT_EMAIL_TO: ${{ parameters.reportEmailTo }}
  # Sender = Gmail (pinned). Only SMTP_PASS comes from a secret pipeline variable.
  SMTP_HOST: 'smtp.gmail.com'
  SMTP_PORT: '587'
  SMTP_USER: 'avinashazureemail@gmail.com'
  SMTP_FROM: 'avinashazureemail@gmail.com'

stages:
  - stage: ContractTests
    displayName: 'Pact Contract Tests'
    jobs:
      - job: ConsumerContracts
        displayName: 'Consumer — generate pact files'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run test:contract:consumer-only
            displayName: 'Run consumer contract tests'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)

          # Same rules as ContractCoverageAuditor / TestCaseGenratorViaSwagger — fail on uncovered OpenAPI ops
          - script: |
              set -euo pipefail
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%%/api-docs*}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              echo "Swagger coverage audit against: $GATEWAY_BASE_URL/openapi.json"
              npm run test:swagger-coverage:ci
            displayName: 'Swagger coverage gate (OpenAPI ↔ Pact)'
            env:
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(GATEWAY_BASE_URL)
              SWAGGER_COVERAGE_FAIL: '1'
              SWAGGER_COVERAGE_WRITE_DOC: '1'

          - publish: $(System.DefaultWorkingDirectory)/pacts
            artifact: pact-files
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/reports
            artifact: pact-reports
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/docs
            artifact: swagger-gap-doc
            condition: succeededOrFailed()

      - job: ProviderVerification
        displayName: 'Provider — verify API against contracts'
        dependsOn: ConsumerContracts
        condition: succeeded()
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - download: current
            artifact: pact-files

          - download: current
            artifact: pact-reports

          - script: |
              set -e
              mkdir -p pacts reports
              cp -r "$(Pipeline.Workspace)/pact-files/"* pacts/
              cp -r "$(Pipeline.Workspace)/pact-reports/"* reports/ 2>/dev/null || true
              ls -la pacts reports || true
            displayName: 'Copy pact files into workspace'

          # Swagger: getGatewayHealth + listContracts (api-docs #/Gateway/listContracts)
          - script: |
              set -euo pipefail
              GATEWAY="${GATEWAY_BASE_URL:-${PACT_PROVIDER_URL:-${TAXMESH_BASE_URL:-}}}"
              GATEWAY="${GATEWAY%/}"
              # Allow pasting a full api-docs URL by mistake — strip to origin
              GATEWAY="${GATEWAY%%/api-docs*}"
              GATEWAY="${GATEWAY%/}"
              echo "Swagger-aligned pre-check against: $GATEWAY"
              echo "  GET $GATEWAY/api/health          (getGatewayHealth)"
              echo "  GET $GATEWAY/api/contracts       (listContracts)"
              echo "  GET $GATEWAY/api/proxy/CLM/health (Service CLM proxy)"
              if [ -z "$GATEWAY" ]; then
                echo "##vso[task.logissue type=error]GATEWAY_BASE_URL is empty. Set Run pipeline → TaxMesh gateway origin."
                exit 1
              fi
              curl -sf --retry 8 --retry-delay 3 --connect-timeout 15 \
                "${GATEWAY}/api/health" | head -c 400
              echo
              curl -sf --retry 5 --retry-delay 2 --connect-timeout 15 \
                "${GATEWAY}/api/contracts" | head -c 400
              echo
              curl -sf --retry 5 --retry-delay 2 --connect-timeout 15 \
                "${GATEWAY}/api/proxy/CLM/health" | head -c 400
              echo
            displayName: 'Health check — TaxMesh gateway (Swagger)'

          - script: |
              set -euo pipefail
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%%/api-docs*}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export TAXMESH_BASE_URL="${GATEWAY_BASE_URL}"
              export PACT_PROVIDER_URL="${GATEWAY_BASE_URL}"
              echo "Provider verify against gateway: $GATEWAY_BASE_URL"
              echo "  listContracts : $GATEWAY_BASE_URL/api/contracts"
              echo "  CLM proxy     : $GATEWAY_BASE_URL/api/proxy/CLM  (Swagger uppercase)"
              npm run test:contract:provider-only
            displayName: 'Run provider verification + generate report'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(GATEWAY_BASE_URL)
              PACT_PROVIDER_URL: $(GATEWAY_BASE_URL)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          # Host/user pinned to Gmail so ADO library vars (e.g. smtp.office365.com) cannot override.
          # Only SMTP_PASS comes from a secret pipeline variable (Gmail App Password).
          - script: |
              set -euo pipefail
              if [ -z "${SMTP_PASS:-}" ]; then
                echo "SMTP_PASS not set — skipping email report. Add secret variable SMTP_PASS = Gmail App Password."
                exit 0
              fi
              # Collapse empty entries from pasted "a,,b" recipient lists
              REPORT_EMAIL_TO="$(echo "${REPORT_EMAIL_TO}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | paste -sd, -)"
              echo "SMTP: ${SMTP_HOST} as ${SMTP_USER}"
              echo "Sending HTML report to: ${REPORT_EMAIL_TO}"
              npm run send-report
            displayName: 'Email HTML report'
            condition: succeededOrFailed()
            continueOnError: true
            env:
              SMTP_HOST: 'smtp.gmail.com'
              SMTP_PORT: '587'
              SMTP_USER: 'avinashazureemail@gmail.com'
              SMTP_FROM: 'avinashazureemail@gmail.com'
              SMTP_PASS: $(SMTP_PASS)
              REPORT_EMAIL_TO: $(REPORT_EMAIL_TO)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - script: mkdir -p reports dashboard
            displayName: 'Ensure report/dashboard folders exist'
            condition: always()

          - publish: $(System.DefaultWorkingDirectory)/reports
            artifact: pact-provider-report
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/dashboard
            artifact: pact-dashboard
            condition: succeededOrFailed()
