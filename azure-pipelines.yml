# CI/CD: Pact contract tests gate (TaxMesh)
# Pattern reference: EY_Demo ContractTestDemo-Pact (build 260)
# Gateway URL source of truth: gateway.config.json  (npm run sync:gateway)
# Swagger (live): https://notifications-ads-cnet-room.trycloudflare.com/api-docs
#   Gateway listContracts ? GET {TARGET}/api/contracts
#   Service proxy         ? GET {TARGET}/api/proxy/{CLM|MDM|ACC|TAX|ALC|DOC}/?
# Project: https://dev.azure.com/InnoVisionDA/ContractTesting
#
# Change tunnel: edit gateway.config.json ? npm run sync:gateway ? commit.
# Run pipeline UI: leave override blank to use gateway.config.json, or paste a one-off origin.
# Required secret variable: SMTP_PASS = Gmail App Password for SMTP_USER below.

parameters:
  - name: gatewayBaseUrl
    displayName: 'Override gateway URL (blank = gateway.config.json)'
    type: string
    default: ''

  - name: services
    displayName: 'Services to run (CLM,MDM | all | comma list)'
    type: string
    default: 'CLM,MDM'

  - name: runSwaggerCoverageGate
    displayName: 'Run full Swagger coverage gate (OpenAPI ↔ Pact)'
    type: boolean
    default: true

  - name: reportEmailTo
    displayName: 'Send HTML report to'
    type: string
    default: 'avinash.sharma@newvision-software.com,ananthi.balasubramanian@newvision-software.com,satyam.chouksey@newvision-software.com'

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'
  PACT_DO_NOT_TRACK: 'true'
  # Optional one-off override from Run pipeline UI; blank ? gateway.config.json
  GATEWAY_BASE_URL_OVERRIDE: ${{ parameters.gatewayBaseUrl }}
  PACT_SERVICES: ${{ parameters.services }}
  REPORT_EMAIL_TO: ${{ parameters.reportEmailTo }}
  # Sender = Gmail (pinned). Only SMTP_PASS comes from a secret pipeline variable.
  SMTP_HOST: 'smtp.gmail.com'
  SMTP_PORT: '587'
  SMTP_USER: 'avinashazureemail@gmail.com'
  SMTP_FROM: 'avinashazureemail@gmail.com'

stages:
  - stage: ContractTests
    displayName: 'Pact Contract Tests'
    jobs:
      - job: ConsumerContracts
        displayName: 'Consumer ? generate pact files (${{ parameters.services }})'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          # Manual "Run pipeline" often sticks a stale Commit SHA ? move to branch tip.
          # Skip on PRs so we keep the PR merge commit.
          - script: |
              set -euo pipefail
              BRANCH="$(echo "$(Build.SourceBranch)" | sed 's#refs/heads/##')"
              if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "$(Build.SourceBranch)" ]; then
                BRANCH="main"
              fi
              echo "Syncing workspace to latest origin/${BRANCH} (was $(git rev-parse --short HEAD))"
              git fetch origin "${BRANCH}"
              git checkout -B "${BRANCH}" "origin/${BRANCH}"
              echo "HEAD is now $(git rev-parse HEAD) ? $(git log -1 --oneline)"
            displayName: 'Use latest commit on branch'
            condition: ne(variables['Build.Reason'], 'PullRequest')

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: |
              set -euo pipefail
              node scripts/resolve-gateway-url.js --ado
            displayName: 'Resolve gateway URL (gateway.config.json)'
            env:
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)

          - script: |
              set -euo pipefail
              echo "Consumer: full suite (all modules)"
              echo "Provider scope (next job): ${PACT_SERVICES}"
              npm run test:contract:consumer-only -- --full-consumer
            displayName: 'Run full consumer contract tests'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)
              PACT_FULL_CONSUMER: '1'
              PACT_SERVICES: $(PACT_SERVICES)

          # Full OpenAPI gate — still run after consumer failures when enabled
          - script: |
              set -euo pipefail
              node scripts/resolve-gateway-url.js --ado
              export GATEWAY_BASE_URL="$(
                GATEWAY_BASE_URL= TAXMESH_BASE_URL= PACT_PROVIDER_URL= \
                node scripts/resolve-gateway-url.js
              )"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%%/api-docs*}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export TAXMESH_BASE_URL="${GATEWAY_BASE_URL}"
              echo "Swagger coverage audit against: $GATEWAY_BASE_URL/openapi.json"
              npm run test:swagger-coverage:ci
            displayName: 'Swagger coverage gate (OpenAPI ↔ Pact)'
            condition: and(succeededOrFailed(), eq('${{ parameters.runSwaggerCoverageGate }}', true))
            continueOnError: true
            env:
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)
              SWAGGER_COVERAGE_FAIL: '1'
              SWAGGER_COVERAGE_WRITE_DOC: '1'

          - publish: $(System.DefaultWorkingDirectory)/pacts
            artifact: pact-files
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/reports
            artifact: pact-reports
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/docs
            artifact: swagger-gap-doc
            condition: succeededOrFailed()

      - job: ProviderVerification
        displayName: 'Provider — verify API (${{ parameters.services }})'
        dependsOn: ConsumerContracts
        # Always continue after consumer (pass or fail) so provider + email still run
        condition: succeededOrFailed()
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          - script: |
              set -euo pipefail
              BRANCH="$(echo "$(Build.SourceBranch)" | sed 's#refs/heads/##')"
              if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "$(Build.SourceBranch)" ]; then
                BRANCH="main"
              fi
              echo "Syncing workspace to latest origin/${BRANCH} (was $(git rev-parse --short HEAD))"
              git fetch origin "${BRANCH}"
              git checkout -B "${BRANCH}" "origin/${BRANCH}"
              echo "HEAD is now $(git rev-parse HEAD) ? $(git log -1 --oneline)"
            displayName: 'Use latest commit on branch'
            condition: ne(variables['Build.Reason'], 'PullRequest')

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: |
              set -euo pipefail
              node scripts/resolve-gateway-url.js --ado
            displayName: 'Resolve gateway URL (gateway.config.json)'
            env:
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)

          - download: current
            artifact: pact-files
            continueOnError: true

          - download: current
            artifact: pact-reports
            continueOnError: true

          - script: |
              set -e
              mkdir -p pacts reports
              cp -r "$(Pipeline.Workspace)/pact-files/"* pacts/ 2>/dev/null || echo "No pact-files artifact (consumer may have failed early)"
              cp -r "$(Pipeline.Workspace)/pact-reports/"* reports/ 2>/dev/null || true
              ls -la pacts reports || true
            displayName: 'Copy pact files into workspace'
            condition: succeededOrFailed()

          # Health: gateway + scoped service proxies (default CLM + MDM)
          # Re-resolve here so a stale ADO library GATEWAY_BASE_URL cannot win.
          - script: |
              set -euo pipefail
              # Publish job vars from config (ignores stale ADO GATEWAY_BASE_URL)
              node scripts/resolve-gateway-url.js --ado
              # Blank ambient vars so stdout resolve cannot pick up a dead tunnel
              GATEWAY="$(
                GATEWAY_BASE_URL= TAXMESH_BASE_URL= PACT_PROVIDER_URL= \
                node scripts/resolve-gateway-url.js
              )"
              GATEWAY="${GATEWAY%/}"
              GATEWAY="${GATEWAY%%/api-docs*}"
              GATEWAY="${GATEWAY%/}"
              SERVICES="${PACT_SERVICES:-CLM,MDM}"
              echo "Swagger-aligned pre-check against: $GATEWAY"
              echo "  Source        : gateway.config.json (or Run pipeline Override)"
              echo "  Scope         : $SERVICES"
              echo "  GET $GATEWAY/api/health          (getGatewayHealth)"
              if [ -z "$GATEWAY" ]; then
                echo "##vso[task.logissue type=error]Gateway URL empty. Edit gateway.config.json or set Override gateway URL."
                exit 1
              fi
              curl -sf --retry 8 --retry-delay 3 --connect-timeout 15 \
                "${GATEWAY}/api/health" | head -c 400
              echo
              IFS=',' read -ra SVC_ARR <<< "$SERVICES"
              for raw in "${SVC_ARR[@]}"; do
                svc="$(echo "$raw" | tr '[:lower:]' '[:upper:]' | xargs)"
                if [ -z "$svc" ] || [ "$svc" = "ALL" ] || [ "$svc" = "GATEWAY" ]; then
                  continue
                fi
                echo "  GET $GATEWAY/api/proxy/${svc}/health"
                curl -sf --retry 5 --retry-delay 2 --connect-timeout 15 \
                  "${GATEWAY}/api/proxy/${svc}/health" | head -c 400
                echo
              done
            displayName: 'Health check — gateway + scoped services'
            condition: succeededOrFailed()
            continueOnError: true
            env:
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)
              PACT_SERVICES: $(PACT_SERVICES)

          - script: |
              set -euo pipefail
              node scripts/resolve-gateway-url.js --ado
              export GATEWAY_BASE_URL="$(
                GATEWAY_BASE_URL= TAXMESH_BASE_URL= PACT_PROVIDER_URL= \
                node scripts/resolve-gateway-url.js
              )"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%%/api-docs*}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export TAXMESH_BASE_URL="${GATEWAY_BASE_URL}"
              export PACT_PROVIDER_URL="${GATEWAY_BASE_URL}"
              export PACT_SERVICES="${PACT_SERVICES:-CLM,MDM}"
              echo "Provider verify against gateway: $GATEWAY_BASE_URL"
              echo "  Scope         : $PACT_SERVICES"
              echo "  CLM proxy     : $GATEWAY_BASE_URL/api/proxy/CLM"
              echo "  MDM proxy     : $GATEWAY_BASE_URL/api/proxy/MDM"
              npm run test:contract:provider-only -- --services="${PACT_SERVICES}"
            displayName: 'Run provider verification + generate report (${{ parameters.services }})'
            condition: succeededOrFailed()
            continueOnError: true
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)
              PACT_SERVICES: $(PACT_SERVICES)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          # Swagger gap after provider — same gate as consumer job; gaps mark FAIL email
          - script: |
              set -euo pipefail
              node scripts/resolve-gateway-url.js --ado
              export GATEWAY_BASE_URL="$(
                GATEWAY_BASE_URL= TAXMESH_BASE_URL= PACT_PROVIDER_URL= \
                node scripts/resolve-gateway-url.js
              )"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%%/api-docs*}"
              export GATEWAY_BASE_URL="${GATEWAY_BASE_URL%/}"
              export TAXMESH_BASE_URL="${GATEWAY_BASE_URL}"
              echo "Provider-stage Swagger coverage audit against: $GATEWAY_BASE_URL/openapi.json"
              npm run test:swagger-coverage:ci
            displayName: 'Swagger coverage gate — provider stage (OpenAPI ↔ Pact)'
            condition: and(succeededOrFailed(), eq('${{ parameters.runSwaggerCoverageGate }}', true))
            continueOnError: true
            env:
              GATEWAY_BASE_URL_OVERRIDE: $(GATEWAY_BASE_URL_OVERRIDE)
              SWAGGER_COVERAGE_FAIL: '1'
              SWAGGER_COVERAGE_WRITE_DOC: '1'

          # Rebuild Excel/JSON/dashboard with coverage gaps (forces overall FAILED when gaps exist)
          - script: |
              set -euo pipefail
              npm run report:refresh
              node -e "
                const fs=require('fs');
                const p='reports/pact-report.json';
                if(!fs.existsSync(p)) process.exit(0);
                const r=JSON.parse(fs.readFileSync(p,'utf8'));
                const cg=(r.coverage&&r.coverage.gaps&&r.coverage.gaps.consumer)||[];
                const pg=(r.coverage&&r.coverage.gaps&&r.coverage.gaps.provider)||[];
                console.log('Coverage gaps — consumer:', cg.length, 'provider:', pg.length, 'overall:', r.overallStatus);
                if (cg.length) {
                  console.log('Consumer/Pact missing:');
                  cg.slice(0,20).forEach(g => console.log(' ', g.method, g.path));
                }
                if (pg.length) {
                  console.log('Provider failures:');
                  pg.slice(0,20).forEach(g => console.log(' ', g.method, g.path, '-', g.note||''));
                }
              "
            displayName: 'Refresh report with swagger + provider gaps'
            condition: succeededOrFailed()
            continueOnError: true

          # Host/user pinned to Gmail so ADO library vars (e.g. smtp.office365.com) cannot override.
          # Only SMTP_PASS comes from a secret pipeline variable (Gmail App Password).
          # Always attempt email on success OR failure (consumer/provider/health/swagger gaps).
          - script: |
              set -euo pipefail
              if [ -z "${SMTP_PASS:-}" ]; then
                echo "SMTP_PASS not set — skipping email report. Add secret variable SMTP_PASS = Gmail App Password."
                exit 0
              fi
              # Collapse empty entries from pasted "a,,b" recipient lists
              REPORT_EMAIL_TO="$(echo "${REPORT_EMAIL_TO}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | paste -sd, -)"
              echo "SMTP: ${SMTP_HOST} as ${SMTP_USER}"
              echo "Sending HTML report to: ${REPORT_EMAIL_TO}"
              npm run send-report
            displayName: 'Email HTML report (FAIL when gaps)'
            condition: always()
            continueOnError: true
            env:
              SMTP_HOST: 'smtp.gmail.com'
              SMTP_PORT: '587'
              SMTP_USER: 'avinashazureemail@gmail.com'
              SMTP_FROM: 'avinashazureemail@gmail.com'
              SMTP_PASS: $(SMTP_PASS)
              REPORT_EMAIL_TO: $(REPORT_EMAIL_TO)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - script: mkdir -p reports dashboard
            displayName: 'Ensure report/dashboard folders exist'
            condition: always()

          - publish: $(System.DefaultWorkingDirectory)/reports
            artifact: pact-provider-report
            condition: succeededOrFailed()

          - publish: $(System.DefaultWorkingDirectory)/dashboard
            artifact: pact-dashboard
            condition: succeededOrFailed()
