# CI/CD: Pact contract tests gate (TaxMesh) — EY_Demo-style reporting
# Azure DevOps: https://dev.azure.com/InnoVisionDA/ContractTesting
# GitHub:       https://github.com/Avinash258/ContractTestingDemoProject
#
# Pipeline variables (secret where noted):
#   GATEWAY_BASE_URL / TAXMESH_BASE_URL — TaxMesh gateway (required for provider)
#   URL_CLM … URL_DOC                   — optional direct service bases
#   SMTP_USER / SMTP_PASS (secret)      — email HTML report
#   REPORT_EMAIL_TO / SMTP_FROM / SMTP_HOST / SMTP_PORT

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20.x'
  PACT_DO_NOT_TRACK: 'true'
  REPORT_EMAIL_TO: 'aviansh.sharma@newvision-software.com'
  SMTP_HOST: 'smtp.office365.com'
  SMTP_PORT: '587'
  SMTP_FROM: 'aviansh.sharma@newvision-software.com'
  # Override in pipeline UI for your live TaxMesh stack / tunnel
  # GATEWAY_BASE_URL: 'https://your-taxmesh-host'

stages:
  - stage: ContractTests
    displayName: 'Pact Contract Tests'
    jobs:
      - job: ConsumerContracts
        displayName: 'Consumer — generate pact files + report seed'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run test:contract:consumer-only
            displayName: 'Run consumer contract tests + HTML/JSON report'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish pact files'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/pacts
              artifact: pact-files

          - task: PublishPipelineArtifact@1
            displayName: 'Publish consumer reports'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/reports
              artifact: pact-reports

      - job: ProviderVerification
        displayName: 'Provider — verify TaxMesh APIs + email report'
        dependsOn: ConsumerContracts
        condition: succeeded()
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download pact files'
            inputs:
              buildType: current
              artifactName: pact-files
              targetPath: $(Pipeline.Workspace)/pact-files

          - task: DownloadPipelineArtifact@2
            displayName: 'Download consumer reports'
            inputs:
              buildType: current
              artifactName: pact-reports
              targetPath: $(Pipeline.Workspace)/pact-reports

          - script: |
              set -e
              mkdir -p pacts reports
              cp -r "$(Pipeline.Workspace)/pact-files/"* pacts/ || true
              cp -r "$(Pipeline.Workspace)/pact-reports/"* reports/ || true
              ls -la pacts reports || true
            displayName: 'Restore pact files and consumer results'

          - bash: |
              set -euo pipefail
              GATEWAY="${GATEWAY_BASE_URL:-${TAXMESH_BASE_URL:-}}"
              if [ -z "$GATEWAY" ]; then
                echo "##vso[task.logissue type=error]Set pipeline variable GATEWAY_BASE_URL (or TAXMESH_BASE_URL) to your TaxMesh gateway."
                exit 1
              fi
              echo "Pre-check gateway: $GATEWAY/api/health"
              curl -sf --retry 8 --retry-delay 3 "$GATEWAY/api/health" | head -c 800
              echo
            displayName: 'Pre-check — TaxMesh gateway health'
            env:
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(TAXMESH_BASE_URL)

          - script: npm run test:contract:provider-only
            displayName: 'Run provider verification + generate report'
            env:
              PACT_DO_NOT_TRACK: $(PACT_DO_NOT_TRACK)
              GATEWAY_BASE_URL: $(GATEWAY_BASE_URL)
              TAXMESH_BASE_URL: $(TAXMESH_BASE_URL)
              URL_CLM: $(URL_CLM)
              URL_MDM: $(URL_MDM)
              URL_ACC: $(URL_ACC)
              URL_TAX: $(URL_TAX)
              URL_ALC: $(URL_ALC)
              URL_DOC: $(URL_DOC)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - script: |
              if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
                echo "SMTP_USER or SMTP_PASS not set — skipping email report."
                exit 0
              fi
              npm run send-report
            displayName: 'Email HTML report'
            condition: succeededOrFailed()
            continueOnError: true
            env:
              SMTP_USER: $(SMTP_USER)
              SMTP_PASS: $(SMTP_PASS)
              SMTP_HOST: $(SMTP_HOST)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_FROM: $(SMTP_FROM)
              REPORT_EMAIL_TO: $(REPORT_EMAIL_TO)
              BUILD_BUILDID: $(Build.BuildId)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish provider + combined report'
            condition: succeededOrFailed()
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/reports
              artifact: pact-provider-report
